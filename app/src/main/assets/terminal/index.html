<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="xterm.css"><style>html,body,#terminal{height:100%;margin:0;background:#10151d}body{padding:4px;box-sizing:border-box}</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
const term = new Terminal({cursorBlink:true,scrollback:3000,fontSize:Native.fontSize(),theme:{background:'#10151d',foreground:'#e6edf3'},allowProposedApi:false});
const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById('terminal'));
window.receive = (encoded,id) => term.write(Uint8Array.from(atob(encoded), c=>c.charCodeAt(0)),()=>Native.consumed(id));
term.onData(data=>Native.input(data)); term.onResize(size=>Native.resize(size.cols,size.rows));
new ResizeObserver(()=>{try{fit.fit()}catch{}}).observe(document.getElementById('terminal'));
requestAnimationFrame(()=>{fit.fit();Native.ready(term.cols,term.rows)});
</script></body></html>
